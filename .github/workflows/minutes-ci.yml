# Minutes CI — typecheck (Ubuntu) + macOS native install smoke.
# Runs on PRs only (not every push to main) to save GitHub Actions minutes;
# Release Minutes still typechecks and packages installers.
name: Minutes CI

on:
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minutes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (Minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache electron-gyp
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.electron-gyp
          key: electron-gyp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install libpulse0
        run: sudo apt-get install -y libpulse0 || (sudo apt-get update && sudo apt-get install -y libpulse0)

      - name: Install dependencies
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          # Skip native compile on Linux CI — typecheck only needs JS deps.
          NPM_CONFIG_NODE_GYP: echo

      - name: Generate build artifacts
        run: pnpm run generate

      - name: Typecheck
        run: pnpm run check:types

  # Catches macOS-only postinstall failures (Python/gyp, electron-rebuild races,
  # invalid install-app-deps flags) before Release Minutes burns a Windows build.
  macos-native-smoke:
    name: macOS native install (smoke)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python for node-gyp
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Cache electron-gyp
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.electron-gyp
          key: electron-gyp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-v2

      - name: Install dependencies (real native rebuild)
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          PYTHON: ${{ steps.python.outputs.python-path }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
          # Fail the job if electron:install-app-deps fails (same as release).
          MINUTES_STRICT_NATIVE_BUILD: '1'

      - name: Verify macOS native addons
        run: |
          set -euo pipefail
          test -f packages/mute-state-change/build/Release/mute-state-change.node
          test -f node_modules/@signalapp/ringrtc/build/darwin/libringrtc-arm64.node
          echo "Native addons OK:"
          ls -la packages/mute-state-change/build/Release/*.node
          ls -la node_modules/@signalapp/ringrtc/build/darwin/libringrtc-arm64.node

  # Manual, artifact-only packaging path for testing the current branch on
  # Windows. Unlike minutes-release.yml this never bumps a version, pushes a
  # commit, creates a tag, or publishes a GitHub Release.
  windows-beta-installer:
    name: Windows beta installer (artifact)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache electron-gyp
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.electron-gyp
          key: electron-gyp-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      - name: Generate build artifacts
        run: pnpm run generate
        env:
          NODE_CONFIG_ENV: minutes-beta

      - name: Generate Minutes Beta icons
        run: pnpm run build:minutes-icons
        env:
          NODE_CONFIG_ENV: minutes-beta

      - name: Typecheck
        run: pnpm run check:types

      - name: Test Windows MP4 support
        run: pnpm exec electron-mocha --timeout 10000 --extension ts,tsx,js,mjs --file ts/test-node/setup.preload.ts ts/test-node/minutes/videoMp4Support_test.main.ts
        env:
          NODE_ENV: test
          NODE_OPTIONS: --import=tsx
          LANG: en-us

      - name: Build unsigned beta installer
        run: pnpm run build:minutes:installer
        env:
          MINUTES_SKIP_VERSION_BUMP: '1'
          MINUTES_SKIP_GENERATE: '1'
          MINUTES_SKIP_ICONS: '1'
          MINUTES_SKIP_BUNDLES: '1'
          MINUTES_RELEASE_CHANNEL: beta
          NODE_CONFIG_ENV: minutes-beta
          DISABLE_INSPECT_FUSE: on

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minutes-beta-windows-x64-${{ github.sha }}
          path: release/minutes/Minutes-Beta-setup-*.exe
          if-no-files-found: error
          retention-days: 7
